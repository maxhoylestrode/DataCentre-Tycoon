<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No browser zoom: the game handles pinch-to-zoom itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Datacentre Tycoon</title>
    <meta name="description" content="Build and run your own datacentre: racks, power, cooling, contracts and rooms." />
    <meta name="theme-color" content="#14171c" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DC Tycoon" />
    <style>
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #14171c;
        overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      /* HUD: a frosted card matching the hotbar. Only its controls take clicks. */
      .hud {
        position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px)); box-sizing: border-box;
        padding: 10px 12px; background: rgba(22, 26, 32, 0.88); border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4); color: #d8dee6; font: 12.5px/1.45 system-ui, sans-serif;
        pointer-events: none; user-select: none;
      }
      .hud .interactive, .hud button { pointer-events: auto; }
      .hud .muted { color: #8a94a3; }
      .hud .good { color: #7fe0a8; }
      .hud .bad, .hud .negative { color: #ff7a7f; }
      .hud .warn { color: #ffb347; }
      .hud-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .hud-title { font-weight: 700; color: #fff; font-size: 13px; }
      .hud-level { font-size: 11.5px; color: #c3b8ff; white-space: nowrap; }
      .hud .bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; margin-top: 3px; }
      .hud .bar .fill { height: 100%; background: #4cc38a; transition: width 0.2s; }
      .hud .bar .fill.high { background: #ffd23a; }
      .hud .bar .fill.over { background: #ff5a5f; }
      .hud .bar.xp { height: 4px; margin: 4px 0 8px; }
      .hud .bar.xp .xp-fill { height: 100%; background: linear-gradient(90deg, #7a4ff0, #b28cff); transition: width 0.3s; }
      .hud-money { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
      .hud-cash { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1.1; }
      .hud-net { position: relative; cursor: help; text-align: right; }
      .hud-net-value { font-size: 14px; font-weight: 700; }
      .hud-net-value small { font-weight: 400; color: #8a94a3; }
      .hud-breakdown {
        display: none; position: absolute; top: calc(100% + 6px); right: -6px; z-index: 5; min-width: 170px; padding: 8px 10px;
        background: rgba(16, 19, 24, 0.97); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; text-align: left;
      }
      .hud-breakdown div { display: flex; justify-content: space-between; gap: 12px; }
      .hud-net:hover .hud-breakdown, .hud-net:focus .hud-breakdown { display: block; }
      .hud-time { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 6px; }
      .hud-clock { color: #b6c2d1; }
      .hud-speed { display: flex; background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 2px; }
      .hud-speed button { border: 0; background: transparent; padding: 2px 8px; font-size: 11.5px; border-radius: 6px; color: #b6c2d1; }
      .hud-speed button.active { background: var(--hb-accent, #4aa8ff); color: #fff; }
      .hud-meter { display: flex; align-items: center; gap: 8px; width: 100%; margin: 4px 0; padding: 0; background: transparent; border: 0; text-align: left; font: inherit; color: inherit; }
      button.hud-meter { cursor: pointer; border-radius: 6px; }
      button.hud-meter:hover { background: rgba(255, 255, 255, 0.05); }
      .hud-meter-icon svg { width: 16px; height: 16px; color: #8a94a3; display: block; }
      .hud-meter-body { flex: 1; }
      .hud-meter-label { display: flex; justify-content: space-between; font-size: 11.5px; }
      .hud-meter-label span { color: #8a94a3; }
      .hud-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .hud-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 1px 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); color: #c9d2dc; }
      .hud-chip svg { width: 12px; height: 12px; }
      .hud-chip.warn { background: rgba(255, 179, 71, 0.15); color: #ffc87a; }
      .hud-info { min-height: 1.4em; margin-top: 6px; color: #b6c2d1; font-size: 12px; }
      .hud-warnings { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
      .hud-warn { font-size: 11.5px; padding: 3px 8px; border-radius: 7px; border-left: 3px solid; }
      .hud-warn.bad { background: rgba(255, 90, 95, 0.12); border-color: #ff5a5f; color: #ffb0b3; }
      .hud-warn.warn { background: rgba(255, 179, 71, 0.12); border-color: #ffb347; color: #ffd5a0; }
      .hud-warn.info { background: rgba(74, 168, 255, 0.1); border-color: #4aa8ff; color: #b8dcff; }
      /* Guide */
      .guide-panel { width: min(720px, calc(100vw - 24px)); }
      .guide-layout { display: flex; gap: 14px; }
      .guide-layout nav { display: flex; flex-direction: column; gap: 3px; min-width: 150px; }
      .guide-layout nav button { text-align: left; background: transparent; border: 0; padding: 6px 10px; border-radius: 8px; color: #b6c2d1; }
      .guide-layout nav button.active { background: rgba(74, 168, 255, 0.16); color: #fff; }
      .guide-layout article { flex: 1; min-width: 0; line-height: 1.55; }
      .guide-layout article h3 { margin-top: 2px; text-transform: none; letter-spacing: 0; font-size: 16px; color: #fff; }
      .guide-layout article .tip { padding: 7px 10px; border-radius: 8px; background: rgba(74, 168, 255, 0.1); color: #b8dcff; }
      .guide-layout table.keys td { padding: 3px 12px 3px 0; }
      .guide-layout table.keys td:first-child { color: #fff; font-weight: 600; white-space: nowrap; }
      @media (max-width: 600px) { .guide-layout { flex-direction: column; } .guide-layout nav { flex-direction: row; flex-wrap: wrap; } }
      .network-panel .net-current { background: rgba(74, 168, 255, 0.08); border-radius: 8px; }
      /* Research */
      .research-panel { width: min(760px, calc(100vw - 24px)); }
      .rs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin: 8px 0 14px; }
      .rs-card {
        display: flex; flex-direction: column; gap: 3px; padding: 9px 10px; border-radius: 10px;
        background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .rs-card.done { border-color: rgba(76, 195, 138, 0.45); background: rgba(76, 195, 138, 0.07); }
      .rs-card.running { border-color: rgba(74, 168, 255, 0.6); background: rgba(74, 168, 255, 0.08); }
      .rs-card.locked_level, .rs-card.locked_requires { opacity: 0.55; }
      .rs-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; }
      .rs-top b { color: #fff; }
      .rs-top span { font-size: 11px; white-space: nowrap; }
      .rs-effect { color: #7fe0a8; font-size: 12px; font-weight: 600; }
      .rs-desc { font-size: 11.5px; line-height: 1.35; }
      .rs-action { margin-top: auto; padding-top: 4px; font-size: 11.5px; }
      .rs-action button { width: 100%; }
      /* Stats */
      .contracts.stats-panel.open {
        display: flex; flex-direction: column; overflow: hidden; padding: 0;
        width: min(1180px, calc(100vw - 24px)); height: min(820px, calc(100vh - 120px)); max-height: none;
        background: linear-gradient(180deg, rgba(22, 27, 35, 0.98), rgba(14, 17, 22, 0.98));
        border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      .sx-head { padding: 12px 16px; margin: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); flex-wrap: wrap; }
      .sx-head h2 { font-size: 17px; letter-spacing: 0.02em; }
      .sx-tabs { display: flex; gap: 2px; margin-left: auto; padding: 3px; border-radius: 10px; background: rgba(0, 0, 0, 0.3); }
      .sx-tabs button { padding: 4px 12px; border: 0; border-radius: 8px; background: transparent; color: #8a94a3; font-size: 12px; }
      .sx-tabs button.active { background: #2b3442; color: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset; }
      .sx-head .sx-tabs + button { margin-left: 8px; }
      .sx-layout { display: flex; flex: 1; min-height: 0; }
      .sx-side { width: 270px; flex: none; overflow-y: auto; padding: 8px; border-right: 1px solid rgba(255, 255, 255, 0.06); background: rgba(0, 0, 0, 0.18); }
      .sx-main { flex: 1; min-width: 0; overflow-y: auto; padding: 12px 13px 16px; display: flex; flex-direction: column; gap: 10px; }
      .sx-side button { font: inherit; }
      .sx-cat { margin-bottom: 4px; }
      .sx-cat-head {
        display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 0; border-radius: 8px;
        background: transparent; color: #dfe6ee; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; text-align: left;
      }
      .sx-cat-head:hover { background: rgba(255, 255, 255, 0.04); }
      .sx-cat-icon { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); font-size: 12px; letter-spacing: 0; }
      .sx-count { padding: 0 6px; border-radius: 8px; background: rgba(74, 168, 255, 0.2); color: #8cc8ff; font-size: 10.5px; letter-spacing: 0; }
      .sx-caret { margin-left: auto; color: #6b7480; transform: rotate(-90deg); transition: transform 0.15s; }
      .sx-cat.open .sx-caret { transform: none; }
      .sx-stat {
        display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 5px 8px 5px 12px;
        border: 0; border-radius: 7px; background: transparent; color: #b6c2d1; font-size: 12.5px; text-align: left;
      }
      .sx-stat:hover { background: rgba(255, 255, 255, 0.045); color: #fff; }
      .sx-stat.on { background: color-mix(in srgb, var(--c) 13%, transparent); color: #fff; }
      .sx-check { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--c); box-sizing: border-box; opacity: 0.6; }
      .sx-stat.on .sx-check { background: var(--c); opacity: 1; box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
      .sx-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sx-val { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; font-size: 12px; line-height: 1.2; }
      .sx-trend { font-style: normal; font-size: 10px; font-weight: 600; }
      .sx-trend.good { color: #5ee0a0; }
      .sx-trend.bad { color: #ff7a7f; }
      .sx-trend.flat { color: #6b7480; }
      .sx-kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
      .sx-kpi {
        position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 11px 0; overflow: hidden;
        border-radius: 11px; border: 1px solid rgba(255, 255, 255, 0.06); background: rgba(255, 255, 255, 0.035); text-align: left; font: inherit; color: inherit;
      }
      .sx-kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
      .sx-kpi:hover { border-color: color-mix(in srgb, var(--c) 50%, transparent); }
      .sx-kpi.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, rgba(255, 255, 255, 0.03)); }
      .sx-kpi-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a94a3; }
      .sx-kpi-value { font-size: 17px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sx-kpi small { font-size: 10.5px; color: #8a94a3; }
      .sx-spark { display: block; width: calc(100% + 22px); height: 26px; margin: 4px -11px 0; }
      .sx-card { padding: 11px 13px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.06); background: rgba(255, 255, 255, 0.03); }
      .sx-card-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #dfe6ee; }
      .sx-card-title span { font-weight: 500; text-transform: none; letter-spacing: 0; color: #8a94a3; }
      .sx-chart-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
      .sx-legend { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-height: 24px; align-items: center; }
      .sx-chip {
        display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 9px; border-radius: 20px; font: inherit; font-size: 11.5px;
        border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); color: #fff;
      }
      .sx-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
      .sx-chip span { color: #8a94a3; font-size: 10px; }
      .sx-chip:hover span { color: #fff; }
      .sx-clear { padding: 3px 10px; border-radius: 8px; border: 0; background: rgba(255, 255, 255, 0.06); color: #b6c2d1; font-size: 11.5px; }
      .sx-chart { position: relative; }
      .sx-svg { display: block; max-width: 100%; }
      .sx-svg text { fill: #7d8796; font-size: 10.5px; font-family: system-ui, sans-serif; font-variant-numeric: tabular-nums; }
      .sx-svg .sx-note { fill: #6b7480; font-style: italic; }
      .sx-grid { stroke: rgba(255, 255, 255, 0.06); }
      .sx-zero { stroke: rgba(255, 255, 255, 0.3); stroke-dasharray: 4 4; }
      .sx-cursor { stroke: rgba(255, 255, 255, 0.35); stroke-width: 1; }
      .sx-dot { stroke: #10141a; stroke-width: 2; }
      .sx-empty { display: grid; place-items: center; height: 260px; color: #6b7480; font-size: 13px; }
      .sx-tip {
        display: none; position: absolute; top: 8px; min-width: 170px; padding: 7px 10px; pointer-events: none; z-index: 1;
        border-radius: 9px; background: rgba(10, 13, 18, 0.94); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); font-size: 12px;
      }
      .sx-tip-time { margin-bottom: 4px; color: #8a94a3; font-size: 11px; }
      .sx-tip div:not(.sx-tip-time) { display: flex; align-items: center; gap: 6px; }
      .sx-tip i { width: 8px; height: 8px; border-radius: 2px; }
      .sx-tip b { margin-left: auto; padding-left: 12px; color: #fff; font-variant-numeric: tabular-nums; }
      .sx-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .sx-bar { display: flex; height: 10px; overflow: hidden; border-radius: 6px; background: rgba(255, 255, 255, 0.05); margin-bottom: 8px; gap: 2px; }
      .sx-bar span { min-width: 2px; }
      .sx-brk-row {
        display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 8px; width: 100%; padding: 4px 6px;
        border: 0; border-radius: 6px; background: transparent; color: #b6c2d1; font: inherit; font-size: 12.5px; text-align: left;
      }
      .sx-brk-row:hover { background: rgba(255, 255, 255, 0.045); color: #fff; }
      .sx-brk-row i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
      .sx-brk-row b { color: #fff; font-variant-numeric: tabular-nums; }
      .sx-brk-row em { font-style: normal; color: #8a94a3; text-align: right; font-variant-numeric: tabular-nums; }
      .sx-records { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
      .sx-records div { display: flex; flex-direction: column; }
      .sx-records span { font-size: 10.5px; color: #8a94a3; text-transform: uppercase; letter-spacing: 0.05em; }
      .sx-records b { font-size: 15px; color: #fff; font-variant-numeric: tabular-nums; }
      .sx-inc { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid rgba(255, 255, 255, 0.04); font-size: 12.5px; }
      .sx-inc:first-of-type { border-top: 0; }
      @media (max-width: 1000px) {
        .sx-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .sx-records { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (max-width: 720px) {
        .contracts.stats-panel.open { height: calc(100vh - 90px); }
        .sx-layout { flex-direction: column; overflow-y: auto; }
        .sx-side { width: auto; max-height: 38%; border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .sx-main { overflow: visible; }
        .sx-kpis, .sx-records { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .sx-split { grid-template-columns: 1fr; }
        .sx-inc { grid-template-columns: auto 1fr; }
        .sx-inc .muted { grid-column: 2; }
      }
      .menu .volume input { flex: 1; }
      .network-panel .ct-hist button { margin-left: auto; }
      .staff-panel .ct-hist button { margin-left: auto; }
      .building-panel .rack-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; font-size: 12px; }
      .building-panel .rack-row button { font-size: 11.5px; margin: 0; }
      .building-panel .warn { color: #ffb347; }
      /* Hotbar, in the style of Cities: Skylines 2: a frosted dark bar of icon
         buttons, with a panel of item cards rising above it. The wrapper is
         click-through so the map beside the panel still takes clicks and drags. */
      :root { --hb-bg: rgba(20, 24, 31, 0.9); --hb-edge: rgba(255, 255, 255, 0.08); --hb-accent: #4aa8ff; }
      .hotbar-wrap {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        max-width: calc(100vw - 24px); width: max-content; font-family: system-ui, sans-serif;
        pointer-events: none;
      }
      .hotbar, .hb-panel.open { pointer-events: auto; }
      .hotbar {
        display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 3px; padding: 6px;
        background: var(--hb-bg); border: 1px solid var(--hb-edge); border-radius: 16px;
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .hotbar .hb-btn {
        position: relative; width: 60px; height: 56px; padding: 6px 0 4px; border: 0; border-radius: 11px;
        background: transparent; color: #c9d2dc; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 3px; transition: background 0.12s, color 0.12s, transform 0.12s;
      }
      .hotbar .hb-btn svg { width: 25px; height: 25px; }
      .hotbar .hb-btn:hover { background: rgba(255, 255, 255, 0.07); color: #fff; transform: translateY(-1px); }
      .hotbar .hb-btn.open { background: rgba(255, 255, 255, 0.11); color: #fff; }
      .hotbar .hb-btn.active { background: rgba(74, 168, 255, 0.16); color: var(--hb-accent); }
      .hotbar .hb-btn.active::after {
        content: ''; position: absolute; bottom: 2px; left: 22px; right: 22px; height: 3px;
        border-radius: 2px; background: var(--hb-accent);
      }
      .hotbar .hb-btn.locked { opacity: 0.35; cursor: not-allowed; }
      /* Panel toggles (heat, contracts, staff...) are a compact icon-only cluster. */
      .hotbar .hb-btn.hb-small { width: 40px; height: 40px; padding: 0; }
      .hotbar .hb-btn.hb-small svg { width: 20px; height: 20px; }
      .hotbar .hb-btn.hb-small .hb-label, .hotbar .hb-btn.hb-small .hb-key { display: none; }
      .hotbar .hb-btn.hb-small.active::after { left: 13px; right: 13px; }
      .hb-tools { display: grid; grid-template-columns: repeat(5, 40px); grid-auto-rows: 26px; gap: 2px; }
      .hb-tools .hb-btn.hb-small { height: 26px; border-radius: 8px; }
      .hb-tools .hb-btn.hb-small svg { width: 17px; height: 17px; }
      .hb-label { font-size: 10.5px; letter-spacing: 0.02em; }
      .hb-key {
        position: absolute; top: 3px; right: 5px; font-size: 9px; line-height: 13px; min-width: 13px;
        border-radius: 3px; background: rgba(255, 255, 255, 0.1); color: #9aa6b4;
      }
      .hb-divider { width: 1px; height: 40px; margin: 0 5px; background: var(--hb-edge); }

      /* The item panel. --cat is the category's accent colour. */
      .hb-panel {
        --cat: var(--hb-accent);
        display: none; position: relative; padding: 12px 14px 12px; background: var(--hb-bg);
        border: 1px solid var(--hb-edge); border-top: 2px solid color-mix(in srgb, var(--cat) 70%, transparent);
        border-radius: 16px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5); color: #d8dee6;
        width: max-content; min-width: min(420px, calc(100vw - 24px)); max-width: min(860px, calc(100vw - 24px));
