<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datacentre Tycoon</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      .hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 14px;
        background: rgba(20, 23, 28, 0.85); color: #d8dee6; border-radius: 6px;
        font: 13px/1.5 system-ui, sans-serif; pointer-events: none; user-select: none;
      }
      .hud h1 { margin: 0 0 4px; font-size: 15px; color: #fff; }
      .hud .muted { color: #8a94a3; }
      .hud .cash { font-size: 16px; }
      .hud .negative { color: #ff7a7f; }
      .hud .controls { display: flex; gap: 4px; margin: 6px 0; pointer-events: auto; }
      .hud .info { min-height: 1.5em; color: #b6c2d1; }
      .hud { max-width: min(340px, calc(100vw - 56px)); }
      .hud .power { margin: 4px 0; }
      .hud .bar { height: 6px; background: #2a3039; border-radius: 3px; overflow: hidden; margin-top: 2px; }
      .hud .bar .fill { height: 100%; background: #4cc38a; transition: width 0.2s; }
      .hud .bar .fill.high { background: #ffd23a; }
      .hud .bar .fill.over { background: #ff5a5f; }
      .hud .warnings div { margin-top: 3px; }
      .hud .bad { color: #ff7a7f; }
      .hud .warn { color: #ffb347; }
      /* Hotbar, in the style of Cities: Skylines 2: a frosted dark bar of icon
         buttons, with a panel of item cards rising above it. */
      :root { --hb-bg: rgba(22, 26, 32, 0.88); --hb-edge: rgba(255, 255, 255, 0.07); --hb-accent: #4aa8ff; }
      .hotbar-wrap {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        max-width: calc(100vw - 24px); width: max-content; font-family: system-ui, sans-serif;
      }
      .hotbar {
        display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; padding: 6px;
        background: var(--hb-bg); border: 1px solid var(--hb-edge); border-radius: 14px;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }
      .hotbar .hb-btn {
        position: relative; width: 62px; height: 58px; padding: 6px 0 4px; border: 0; border-radius: 10px;
        background: transparent; color: #c9d2dc; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 3px; transition: background 0.12s, color 0.12s;
      }
      .hotbar .hb-btn svg { width: 26px; height: 26px; }
      .hotbar .hb-btn:hover { background: rgba(255, 255, 255, 0.07); color: #fff; }
      .hotbar .hb-btn.open { background: rgba(255, 255, 255, 0.1); color: #fff; }
      .hotbar .hb-btn.active { background: rgba(74, 168, 255, 0.16); color: var(--hb-accent); }
      .hotbar .hb-btn.active::after {
        content: ''; position: absolute; bottom: 2px; left: 22px; right: 22px; height: 3px;
        border-radius: 2px; background: var(--hb-accent);
      }
      .hotbar .hb-btn.locked { opacity: 0.35; cursor: not-allowed; }
      .hb-label { font-size: 10.5px; letter-spacing: 0.02em; }
      .hb-key {
        position: absolute; top: 3px; right: 5px; font-size: 9px; line-height: 13px; min-width: 13px;
        border-radius: 3px; background: rgba(255, 255, 255, 0.1); color: #9aa6b4;
      }
      .hb-divider { width: 1px; height: 38px; margin: 0 6px; background: var(--hb-edge); }
      .hb-panel {
        display: none; padding: 10px 12px 12px; background: var(--hb-bg); border: 1px solid var(--hb-edge);
        border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); color: #d8dee6;
        max-width: min(820px, calc(100vw - 24px)); box-sizing: border-box;
      }
      .hb-panel.open { display: block; }
      .hb-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: #fff; }
      .hb-head svg { width: 18px; height: 18px; color: var(--hb-accent); }
      .hb-head button { margin-left: auto; padding: 0 8px; background: transparent; border: 0; color: #8a94a3; }
      .hb-head button:hover { color: #fff; background: transparent; }
      .hb-cards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .hb-card {
        width: 118px; padding: 8px; border-radius: 10px; cursor: pointer; box-sizing: border-box;
        background: rgba(255, 255, 255, 0.04); border: 1px solid transparent; transition: background 0.12s, border-color 0.12s;
      }
      .hb-card:hover { background: rgba(255, 255, 255, 0.08); }
      .hb-card.active { border-color: var(--hb-accent); background: rgba(74, 168, 255, 0.12); }
      .hb-card.locked { cursor: not-allowed; }
      .hb-card.locked .hb-thumb svg, .hb-card.locked .hb-name, .hb-card.locked .hb-cost, .hb-card.locked .hb-stat { opacity: 0.35; }
      .hb-thumb {
        position: relative; height: 62px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(160deg, #2c3440, #1b2028); color: #dfe6ee; margin-bottom: 6px;
      }
      .hb-thumb svg { width: 38px; height: 38px; }
      .hb-lock {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; color: #ffd23a; font-size: 11px; font-weight: 600; opacity: 1;
      }
      .hb-card.locked .hb-lock svg { width: 18px; height: 18px; opacity: 1; }
      .hb-name { font-size: 12px; font-weight: 600; color: #fff; line-height: 1.25; }
      .hb-cost { font-size: 12px; color: #7fe0a8; margin-top: 2px; }
      .hb-cost.bad { color: #ff7a7f; }
      .hb-stat { font-size: 10.5px; color: #8a94a3; margin-top: 2px; line-height: 1.3; }
      @media (max-width: 600px) {
        .hotbar .hb-btn { width: 52px; height: 52px; }
        .hb-card { width: 100px; }
      }
      .menu-toggle { position: fixed; top: 12px; right: 12px; font: 13px system-ui, sans-serif; padding: 6px 12px; }
      .menu {
        position: fixed; top: 48px; right: 12px; width: min(300px, calc(100vw - 32px)); box-sizing: border-box;
        display: none; padding: 12px 14px; background: rgba(20, 23, 28, 0.95); border-radius: 8px;
        color: #d8dee6; font: 13px/1.5 system-ui, sans-serif;
      }
      .menu.open { display: block; }
      .menu h2 { margin: 0 0 4px; font-size: 15px; color: #fff; }
      .menu .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
      .menu .muted { color: #8a94a3; }
      .menu .import-confirm { display: none; padding: 8px; background: #2a2330; border-radius: 6px; }
      .menu .import-confirm.visible { display: block; }
      .menu .message { min-height: 1.2em; color: #9fe0bd; }
      .menu .message.error { color: #ff7a7f; }
      .hud .bar.xp .xp-fill { height: 100%; background: #8f7cff; transition: width 0.3s; }
      .hud .level { margin-bottom: 4px; }
      .goals {
        position: fixed; top: 48px; right: 12px; width: min(260px, calc(100vw - 32px)); box-sizing: border-box;
        background: rgba(20, 23, 28, 0.85); border-radius: 8px; color: #d8dee6; font: 13px/1.4 system-ui, sans-serif;
      }
      .goals-header { width: 100%; text-align: left; background: transparent; border: 0; padding: 8px 12px; font-weight: 600; }
      .goals-header::after { content: ' ▾'; color: #8a94a3; }
      .goals.collapsed .goals-header::after { content: ' ▸'; }
      .goals.collapsed .goals-list { display: none; }
      .goals-list { padding: 0 12px 10px; }
      .goals .goal { margin-bottom: 8px; }
      .goals .muted { color: #8a94a3; font-size: 12px; }
      .goals .bar { height: 5px; background: #2a3039; border-radius: 3px; overflow: hidden; margin: 3px 0; }
      .goals .bar .fill { height: 100%; background: #8f7cff; }
      .menu { z-index: 2; }
      .toasts {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3;
        display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none;
        width: min(380px, calc(100vw - 32px));
      }
      .toast {
        pointer-events: auto; cursor: pointer; padding: 8px 14px; border-radius: 8px; text-align: center;
        background: rgba(28, 32, 39, 0.96); color: #d8dee6; font: 13px/1.5 system-ui, sans-serif;
        border: 1px solid #3d4550; transition: opacity 0.5s; box-sizing: border-box; width: 100%;
      }
      .toast.fade { opacity: 0; }
      .toast.goal { border-color: #4cc38a; }
      .toast.achievement { border-color: #ffd23a; }
      .toast.level { border-color: #8f7cff; padding: 14px 18px; }
      .toast .big { font-size: 20px; font-weight: 700; color: #fff; }
      .toast .muted { color: #8a94a3; }
      .toast.failure { border-color: #ff5a5f; }
      .contracts {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
        width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 160px); overflow-y: auto; box-sizing: border-box;
        display: none; padding: 12px 16px; background: rgba(20, 23, 28, 0.97); border-radius: 10px;
        border: 1px solid #3d4550; color: #d8dee6; font: 13px/1.5 system-ui, sans-serif;
      }
      .contracts.open { display: block; }
      .contracts-head { display: flex; justify-content: space-between; align-items: center; }
      .contracts h2 { margin: 0; font-size: 16px; color: #fff; }
      .contracts h3 { margin: 12px 0 4px; font-size: 13px; color: #fff; }
      .contracts .muted { color: #8a94a3; }
      .contracts .capacity { padding: 6px 8px; background: #22272e; border-radius: 6px; margin-top: 8px; }
      .contracts .capacity.bad { background: #3a2226; color: #ff9a9e; }
      .contracts .contract { padding: 8px 10px; margin: 6px 0; background: #22272e; border-radius: 6px; }
      .contracts .contract button { margin-top: 6px; }
      .contracts .good { color: #4cc38a; }
      .contracts .bad { color: #ff7a7f; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: #3b2f6b; border-color: #8f7cff; color: #fff; }
      button.primary:hover:not(:disabled) { background: #4a3c85; }
      .building-panel {
        position: fixed; right: 12px; bottom: 96px; z-index: 2; display: none;
        width: min(290px, calc(100vw - 32px)); box-sizing: border-box; padding: 12px 14px;
        background: rgba(20, 23, 28, 0.95); border: 1px solid #3d4550; border-radius: 10px;
        color: #d8dee6; font: 13px/1.5 system-ui, sans-serif;
      }
      .building-panel.open { display: block; }
      .building-panel .close { position: absolute; top: 8px; right: 8px; padding: 2px 8px; }
      .building-panel h2 { margin: 0 0 4px; font-size: 15px; color: #fff; }
      .building-panel .muted { color: #8a94a3; }
      .building-panel .good { color: #4cc38a; }
      .building-panel .bad { color: #ff7a7f; }
      .building-panel .up { color: #b9a8ff; }
      .building-panel table { width: 100%; margin: 6px 0; border-collapse: collapse; }
      .building-panel td { padding: 2px 0; }
      .building-panel td:last-child { text-align: right; }
      .building-panel button { margin: 4px 4px 0 0; }
      .building-panel .pips { display: flex; gap: 3px; margin: 2px 0 6px; }
      .building-panel .pips span { width: 18px; height: 5px; border-radius: 2px; background: #2a3039; }
      .building-panel .pips span.on { background: #b28cff; }
      .building-panel { max-height: calc(100vh - 220px); overflow-y: auto; bottom: 110px; width: min(340px, calc(100vw - 32px)); }
      .building-panel .slots { margin: 6px 0; }
      .building-panel .slot { padding: 6px 8px; margin: 4px 0; background: #22272e; border-radius: 6px; }
      .building-panel .slot button { margin-top: 4px; font-size: 12px; text-align: left; }
      .building-panel .fine { margin-top: 8px; font-size: 10px; color: #6b7480; }
      .style-option { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 4px 0; background: #22272e; border-radius: 6px; }
      .style-option.active { outline: 1px solid #4cc38a; }
      .style-option .swatch { width: 26px; height: 26px; border-radius: 5px; flex: none; border: 1px solid #3d4550; }
      .style-option .style-name { flex: 1; }
      /* Contracts panel */
      .ct-panel { width: min(680px, calc(100vw - 24px)); padding: 14px 18px 18px; border-radius: 14px; background: rgba(18, 22, 28, 0.97); }
      .ct-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .ct-head svg { width: 22px; height: 22px; color: var(--hb-accent); }
      .ct-head h2 { margin: 0; font-size: 18px; color: #fff; }
      .ct-head button { margin-left: auto; background: transparent; border: 0; color: #8a94a3; font-size: 15px; }
      .ct-panel h3 { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #b6c2d1; }
      .ct-count { background: rgba(74, 168, 255, 0.18); color: var(--hb-accent); border-radius: 10px; padding: 0 8px; font-size: 11px; }
      .ct-note { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: normal; font-size: 12px; }
      .ct-tiles, .ct-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
      .ct-stats { margin: 8px 0; grid-template-columns: repeat(4, 1fr); }
      .ct-tile { background: rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 7px 9px; }
      .ct-tile-value { font-size: 16px; font-weight: 700; color: #fff; }
      .ct-stats .ct-tile-value { font-size: 14px; }
      .ct-tile-value small { font-size: 11px; font-weight: normal; color: #8a94a3; }
      .ct-tile-label { font-size: 11px; color: #8a94a3; margin-top: 1px; }
      .ct-tile.good .ct-tile-value { color: #7fe0a8; }
      .ct-tile.bad .ct-tile-value { color: #ff7a7f; }
      .ct-tile.accent .ct-tile-value { color: var(--hb-accent); }
      .ct-alert { margin-top: 8px; padding: 7px 10px; border-radius: 8px; background: rgba(255, 90, 95, 0.12); color: #ff9a9e; border: 1px solid rgba(255, 90, 95, 0.35); }
      .ct-empty { color: #8a94a3; padding: 10px; border: 1px dashed #3d4550; border-radius: 10px; text-align: center; }
      .ct-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 10px; }
      .ct-card {
        position: relative; padding: 12px 14px 12px 16px; margin-bottom: 10px; border-radius: 12px;
        background: linear-gradient(135deg, color-mix(in srgb, var(--ct-color) 9%, #1d222a), #1b2028 60%);
        border: 1px solid rgba(255, 255, 255, 0.06); overflow: hidden;
      }
      .ct-grid .ct-card { margin-bottom: 0; display: flex; flex-direction: column; }
      .ct-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--ct-color); }
      .ct-card-head { display: flex; align-items: center; gap: 10px; }
      .ct-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #12161c; font-weight: 800; font-size: 13px; flex: none; }
      .ct-who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .ct-who b { color: #fff; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ct-chip { align-self: flex-start; font-size: 10.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid; }
      .ct-pay { margin-left: auto; text-align: right; color: #7fe0a8; white-space: nowrap; }
      .ct-pay b { font-size: 18px; }
      .ct-pay small { color: #8a94a3; }
      .ct-rewards { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
      .ct-pill { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; }
      .ct-pill.good { background: rgba(76, 195, 138, 0.15); color: #7fe0a8; }
      .ct-pill.bad { background: rgba(255, 90, 95, 0.14); color: #ff9a9e; }
      .ct-reqs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 2px; }
      .ct-req { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; background: rgba(255, 90, 95, 0.12); color: #ff9a9e; border: 1px solid rgba(255, 90, 95, 0.3); }
      .ct-req.met { background: rgba(143, 124, 255, 0.15); color: #c3b8ff; border-color: rgba(143, 124, 255, 0.4); }
      .ct-req-count { font-size: 11px; }
      .ct-sign { margin-top: auto; width: 100%; padding: 7px; font-weight: 600; }
      .ct-grid .ct-sign { margin-top: 10px; }
      .ct-cancel { margin-left: auto; font-size: 11.5px; }
      .ct-meter { margin: 8px 0; }
      .ct-meter-label { display: flex; align-items: baseline; gap: 8px; font-size: 12px; margin-bottom: 4px; }
      .ct-meter-label .muted { margin-left: auto; }
      .ct-bar { position: relative; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.07); overflow: visible; }
      .ct-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
      .ct-fill.good { background: linear-gradient(90deg, #2f8f62, #4cc38a); }
      .ct-fill.bad { background: linear-gradient(90deg, #b8383d, #ff5a5f); }
      .ct-fill.time { background: linear-gradient(90deg, #2f6bff, #4aa8ff); }
      .ct-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; border-radius: 1px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4); }
      .ct-hist { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 12.5px; }
      .ct-hist b { color: #e6ebf0; }
      .ct-hist :last-child { margin-left: auto; font-weight: 600; }
      .ct-panel .good { color: #7fe0a8; }
      .ct-panel .bad { color: #ff7a7f; }
      @media (max-width: 600px) { .ct-stats { grid-template-columns: repeat(2, 1fr); } }
      .room-labels { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
      .room-label {
        position: absolute; transform: translate(-50%, -100%); pointer-events: auto;
        display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px;
        background: var(--hb-bg); border: 1px solid rgba(74, 168, 255, 0.5); color: #fff;
        font: 12px/1.35 system-ui, sans-serif; text-align: left; white-space: nowrap;
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      .room-label svg { width: 18px; height: 18px; color: #ffd23a; }
      .room-label:hover { background: rgba(40, 52, 68, 0.95); }
      .room-label.short span { color: #ff9a9e; }
      .room-dialog { width: min(380px, calc(100vw - 32px)); }
      .room-dialog p { margin: 8px 0; }
      button.danger { border-color: #7a3a3d; }
      button.danger:hover { background: #4a2a2d; }
      button {
        font: inherit; color: #d8dee6; background: #2a3039; border: 1px solid #3d4550;
        border-radius: 4px; padding: 3px 10px; cursor: pointer;
      }
      button:hover { background: #343c47; }
      button.active { background: #2f6b50; border-color: #4cc38a; color: #fff; }
      .bankrupt {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(10, 12, 15, 0.6); font: 14px/1.5 system-ui, sans-serif; color: #d8dee6;
      }
      .bankrupt.visible { display: flex; }
      .bankrupt .panel { background: #1c2027; padding: 20px 28px; border-radius: 8px; text-align: center; max-width: 320px; }
      .bankrupt h2 { margin: 0 0 8px; color: #ff7a7f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
