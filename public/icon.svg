<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: a server rack with status LEDs on the hotbar's dark background.
       Drawn as SVG so the project stays free of binary image files. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2533"/>
      <stop offset="1" stop-color="#0f1319"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#262c36"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="146" y="86" width="220" height="340" rx="22" fill="url(#rack)" stroke="#4aa8ff" stroke-width="10"/>
  <g fill="#1a1f27">
    <rect x="176" y="126" width="160" height="46" rx="8"/>
    <rect x="176" y="192" width="160" height="46" rx="8"/>
    <rect x="176" y="258" width="160" height="46" rx="8"/>
    <rect x="176" y="324" width="160" height="46" rx="8"/>
  </g>
  <g fill="#5dff9a">
    <circle cx="306" cy="149" r="9"/>
    <circle cx="306" cy="215" r="9"/>
    <circle cx="306" cy="281" r="9"/>
    <circle cx="282" cy="149" r="9"/>
    <circle cx="282" cy="215" r="9"/>
  </g>
  <circle cx="306" cy="347" r="9" fill="#ffd23a"/>
  <rect x="196" y="143" width="60" height="12" rx="6" fill="#4aa8ff" opacity=".6"/>
  <rect x="196" y="209" width="60" height="12" rx="6" fill="#4aa8ff" opacity=".6"/>
  <rect x="196" y="275" width="60" height="12" rx="6" fill="#4aa8ff" opacity=".6"/>
  <rect x="196" y="341" width="60" height="12" rx="6" fill="#4aa8ff" opacity=".6"/>
</svg>
